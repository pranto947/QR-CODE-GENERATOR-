<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Hub | Connected to Firebase</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #080808; color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .glass-container { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 25px; 
            padding: 40px; 
            width: 100%; 
            max-width: 450px; 
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        h2 { margin-bottom: 25px; color: #00e5ff; font-weight: 300; letter-spacing: 1px; }

        .auth-btn {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn { background: #ffffff; color: #000; }
        .fb-btn { background: #1877F2; color: white; }
        
        .divider { margin: 20px 0; color: #444; font-size: 0.8rem; }

        input { 
            width: 100%; padding: 14px; margin-bottom: 15px; 
            border-radius: 10px; border: 1px solid #222; 
            background: #111; color: white; outline: none;
        }
        input:focus { border-color: #00e5ff; }

        .main-btn { 
            width: 100%; padding: 15px; 
            background: linear-gradient(135deg, #00e5ff, #007bff); 
            border: none; border-radius: 12px; 
            color: white; font-weight: bold; cursor: pointer; 
        }

        #app-content { display: none; }
        #qrcode { margin-top: 25px; display: none; justify-content: center; background: white; padding: 15px; border-radius: 15px; }
        .logout { color: #ff4b2b; margin-top: 20px; cursor: pointer; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="glass-container">
    <div id="auth-box">
        <h2>QR HUB LOGIN</h2>
        <button class="auth-btn google-btn" onclick="signIn('google')">Continue with Google</button>
        <button class="auth-btn fb-btn" onclick="signIn('facebook')">Continue with Facebook</button>

        <div class="divider">OR USE PHONE</div>

        <input type="tel" id="phone-number" placeholder="Enter Phone (+880...)">
        <button class="main-btn" onclick="phoneDummyLogin()">Login / Register</button>
    </div>

    <div id="app-content">
        <h3 id="user-display" style="margin-bottom: 15px;">Welcome!</h3>
        <input type="text" id="qr-input" placeholder="Enter text or URL to generate QR">
        <button class="main-btn" onclick="createQR()">Generate Now</button>
        
        <div id="qrcode"></div>
        <p class="logout" onclick="userLogout()">Logout Account</p>
    </div>
</div>

<script>
    // --- 1. YOUR FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyB2ZryJYCuE-lEIi_TsCDIETNTvWpnyZ_o",
      authDomain: "account-sheet-ce056.firebaseapp.com",
      projectId: "account-sheet-ce056",
      storageBucket: "account-sheet-ce056.firebasestorage.app",
      messagingSenderId: "768952915073",
      appId: "1:768952915073:web:66ae9e53336abf4d966980",
      measurementId: "G-STEYZ2XE54"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // --- 2. AUTH FUNCTIONS ---
    function signIn(providerType) {
        let provider;
        if(providerType === 'google') provider = new firebase.auth.GoogleAuthProvider();
        if(providerType === 'facebook') provider = new firebase.auth.FacebookAuthProvider();

        auth.signInWithPopup(provider).then((result) => {
            enterApp(result.user.displayName);
        }).catch((error) => {
            alert("Error: " + error.message);
        });
    }

    function phoneDummyLogin() {
        const phone = document.getElementById('phone-number').value;
        if(phone.length > 8) enterApp(phone);
        else alert("Please enter a valid phone number!");
    }

    function enterApp(name) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        document.getElementById('user-display').innerText = "Hello, " + name;
    }

    function userLogout() {
        auth.signOut().then(() => {
            location.reload();
        });
    }

    // --- 3. QR GENERATION ---
    function createQR() {
        const text = document.getElementById('qr-input').value;
        if(!text) return alert("Please enter something!");
        
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        qrDiv.style.display = "flex";
        
        new QRCode(qrDiv, {
            text: text,
            width: 180,
            height: 180
        });
    }

    // Check if user is already logged in
    auth.onAuthStateChanged((user) => {
        if (user) {
            enterApp(user.displayName || user.email);
        }
    });
</script>

</body>
</html>
